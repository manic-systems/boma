name: Tag and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  prepare:
    name: Prepare Release
    permissions:
      contents: write
      id-token: write
    needs: ci
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@04de11cf1e8a931302cb4c6ce5b0957dcfa71b74 # v2.3.3
    with:
      stage: prepare
      assets: false
      default-branch: master
      version-command: nix run nixpkgs#fq -- -r .package.version Cargo.toml

  publish:
    name: Publish
    permissions:
      contents: write
      id-token: write
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@04de11cf1e8a931302cb4c6ce5b0957dcfa71b74 # v2.3.3
    with:
      stage: publish
      version: ${{ needs.prepare.outputs.version }}
      install-nix: false
      # The publish runner is Linux and the crate only builds on macOS, where CI already built it.
      publish-command: cargo publish --locked --no-verify
