name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Checks
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@ec457510b197b2eeb8b2ea2d182f31e3ed7157bd # v2.3.3
    with:
      os: macos-latest
      flake-check: false
      fmt: true
      fmt-command: cargo fmt --check && taplo fmt --check
      clippy: true
      clippy-command: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    name: MSRV
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@ec457510b197b2eeb8b2ea2d182f31e3ed7157bd # v2.3.3
    with:
      os: macos-latest
      install-nix: false
      flake-check: false
      rust-toolchain: 1.95.0
      test: true
      test-command: cargo check --locked --all-targets

  build:
    name: Build
    permissions:
      actions: write
      contents: read
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@ec457510b197b2eeb8b2ea2d182f31e3ed7157bd # v2.3.3
    with:
      os: macos-latest
      cache: true
      cache-save: true

  actions:
    name: Actions Lint
    uses: manic-systems/workflows/.github/workflows/actions-lint.yml@ec457510b197b2eeb8b2ea2d182f31e3ed7157bd # v2.3.3

  required:
    name: Required Checks
    if: always()
    needs:
      - checks
      - msrv
      - build
      - actions
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
